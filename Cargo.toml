[package]
name = "gray-dynamic-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Shell-backed tools defined by JSON files in ~/.gray/dynamic-tools — live-reloaded protocol-1.3 tool set."

[[bin]]
name = "gray-dynamic-tools"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
